<!-- Sección 7: Por qué estudiarlo -->
<section class="row justify-content-center ciaf-section-light py-5 mx-0 px-0" id="por-que-estudiarlo">
  <div class="col-xxl-9 col-xl-9 col-lg-10 col-md-10 col-10">
    <div class="row px-0 mx-0 justify-content-center">

      <div class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-12 text-center mb-3" *ngIf="!isProfessional">
        <span class="ciaf-pill ciaf-pill--section fs-12 fw-bold rounded-pill px-4">
          ¿POR QUÉ ESTUDIARLO?
        </span>
        <h2 class="text-color-2 fs-36 fw-extrablack my-3" [innerHTML]="titulo | destacarTexto"></h2>
        <p class="fs-16 text-color-1" *ngIf="subtitulo">{{subtitulo}}</p>
      </div>

      <ng-container *ngIf="isProfessional">
        <div class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-12">
          <span class="ciaf-pill ciaf-pill--section fs-12 fw-bold rounded-pill px-4">
            ¿POR QUÉ ESTUDIARLO?
          </span>
        </div>

        <div class="col-xxl-8 col-xl-8 col-lg-9 col-md-12 col-12 my-3">
          <h2 class="text-color-2 fs-36 fw-extrablack" [innerHTML]="titulo | destacarTexto"></h2>
          <p class="fs-16 text-color-1" *ngIf="subtitulo">{{subtitulo}}</p>
        </div>
      </ng-container>

      <div class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-12">
        <div class="row" ciafStagger=".ciaf-card" ciafStaggerMode="up">

          <div class="col-lg-4 col-md-6 col-12 mb-4" *ngFor="let item of items">
            <article class="ciaf-card p-4 rounded-4">
              <div class="icono-rounded fs-16 mb-2"
                [ngClass]="{
                  'bg-color-1': item.tema === 'azul',
                  'bg-color-2': item.tema === 'verde',
                  'bg-color-9': item.tema === 'celeste'
                }">
                <i [ngClass]="item.icono" [class.text-color-6]="item.tema === 'celeste'"></i>
              </div>

              <h3 class="text-color-2 fs-18 fw-bold" [innerHTML]="item.titulo | destacarTexto"></h3>

              <p class="text-color-1 fs-14" [innerHTML]="item.descripcion | destacarTexto"></p>
            </article>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
