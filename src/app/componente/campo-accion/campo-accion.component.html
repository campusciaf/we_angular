<!-- Sección 2: Campo de acción -->
<div class="row justify-content-center mx-0 px-0">
  <section class="col-xxl-9 col-xl-9 col-lg-10 col-md-10 col-11 ciaf-section-light mt-1 pt-0 pt-xl-5 mx-0 px-0"
    id="campo-de-accion" [class.ciaf-section-light]="campoAccionActivo !== null">
    <div class="row p-4" ciafStagger=".ciaf-campo__item" ciafStaggerMode="up">
      <header class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-12 my-5">
        <span class="ciaf-pill ciaf-pill--section fs-12 fw-bold rounded-pill px-4">Campo de acción</span>
        <h2 class="fs-36 fw-extrablack text-color-2">
          ¿Dónde podrás generar <span class="ciaf-gradient-text ciaf-gradient-text--brand fs-40">impacto</span>?
        </h2>
      </header>

      <!-- Renderizado dinámico desde el array unificado (API o Fallback) -->
      <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-4 col-12 ciaf-campo__item mb-3"
        *ngFor="let item of campoAccion; let i = index"
        [class.ciaf-campo__item--active]="campoAccionActivo === (i + 1).toString()">
        <button type="button" class="card border rounded-4 p-4 w-100 text-start"
          (click)="toggleCampoAccion((i + 1).toString())">
          <div class="ciaf-campo__head d-flex justify-content-between align-items-center mb-1">
            <span class="fs-16 fw-bold text-color-2" [innerHTML]="item.titulo | destacarTexto"></span>
            <i class="fa-solid fa-chevron-right text-color-2"></i>
          </div>
          <div class="ciaf-campo__body fs-14 text-color-1 fw-medium" [innerHTML]="item.descripcion | destacarTexto">
          </div>
        </button>
      </div>
    </div>
  </section>
</div>
