<!-- Sección 3: Experiencias reales -->
<section class="row bg-color-4 py-5 justify-content-center mx-0 px-0" id="experiencias-reales">
  <div class="col-xxl-9 col-xl-9 col-lg-10 col-md-10 col-11">
    <div class="row p-4" ciafStagger=".ciaf-experiencias__card" ciafStaggerMode="up">
      <header class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-12 my-5">
        <span class="ciaf-pill ciaf-pill--section fs-12 fw-bold rounded-pill px-4 mb-2 text-white">
          Experiencias reales
        </span>
        <h2 class="fs-36 fw-extrablack text-white" *ngIf="customTitle || programName">
          {{ customTitle || ('Conoce cómo se vive ' + programName + ' en CIAF') }}
        </h2>
      </header>

      <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-4 col-12 mb-3" *ngFor="let item of experiencias">
        <a class="ciaf-experiencias__card d-block w-100 ratio ratio-16x9 rounded-4 overflow-hidden position-relative text-decoration-none shadow"
          [href]="item.url_video" target="_blank" rel="noopener noreferrer">
          <div class="position-absolute top-0 start-0 w-100 h-100">
            <div class="ciaf-offer-media position-absolute top-0 start-0 w-100 h-100 overflow-hidden">
              <img class="w-100 h-100 object-fit-cover" [src]="item.imagen_portada" [alt]="item.titulo" loading="lazy" />
            </div>
            <span
              class="position-absolute top-50 start-50 translate-middle z-2 d-flex align-items-center justify-content-center rounded-circle bg-color-5 flex-shrink-0 p-3"
              aria-hidden="true">
              <i class="fa-solid fa-play text-dark ms-1"></i>
            </span>
            <span class="position-absolute bottom-0 start-0 z-2 p-3 text-white fs-14 fw-semibold text-start" [innerHTML]="item.titulo | destacarTexto">
            </span>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>
